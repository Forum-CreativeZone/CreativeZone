name: Import Figma Asset Test

on:
  push:
    paths:
      - ".github/workflows/import-figma-asset.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Figma asset
        env:
          FIGMA_ASSET_URL: "https://www.figma.com/api/mcp/asset/d62d6419-7feb-4e47-9452-fb7c9f858f8b.png"
        run: |
          set -euo pipefail
          mkdir -p assets/figma-transfer-test
          curl -L --fail --retry 3 --output assets/figma-transfer-test/223-2-render.png "$FIGMA_ASSET_URL"
          file assets/figma-transfer-test/223-2-render.png
          test -s assets/figma-transfer-test/223-2-render.png

      - name: Commit imported asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/figma-transfer-test/223-2-render.png
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "test: import Figma asset"
          git push
