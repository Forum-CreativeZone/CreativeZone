name: Import Figma Assets

on:
  push:
    paths:
      - ".github/workflows/import-figma-asset.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Figma asset
        run: |
          set -euo pipefail
          mkdir -p assets/figma/601-3
          curl -L --fail --retry 3 --output assets/figma/601-3/export.png "https://www.figma.com/api/mcp/asset/318a0aa4-a0c5-4959-9d90-6b83dd55884f.png"
          test -s assets/figma/601-3/export.png
          file assets/figma/601-3/export.png
      - name: Commit asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/figma/601-3/export.png
          git commit -m "assets: import Figma 601-3" || exit 0
          git push
