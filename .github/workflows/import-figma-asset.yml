name: Import Figma Assets

on:
  push:
    paths:
      - ".github/workflows/import-figma-asset.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Figma assets
        run: |
          set -u
          mkdir -p assets/figma/0-1 assets/figma/223-2 assets/figma/601-3 assets/figma/601-2
          download_asset() {
            local url="$1"
            local out="$2"
            echo "Downloading $out"
            if curl -L --fail --retry 3 --silent --show-error -o "$out" "$url"; then
              test -s "$out"
              return 0
            fi
            echo "::warning::Figma asset unavailable (possibly expired): $out"
            rm -f "$out"
            return 0
          }



      - name: Commit imported assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/figma
          git diff --cached --quiet && exit 0
          git commit -m "assets: import Figma visual assets"
          git pull --rebase origin main
          git push
